name: Refresh stats

on:
  schedule:
    - cron: "17 5 * * *" # daily, 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_stats.py
      - name: Commit if the numbers changed
        run: |
          if git diff --quiet assets/stats.json; then
            echo "No change."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add assets/stats.json
            git commit -m "Refresh view counts and citations"
            git push
          fi
